<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Toe Grip Rehab - Monitor Optimized</title>

    <!-- A-Frame for 3D/VR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js for marker tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- AR Scene - OPTIMIZED FOR MONITOR SCREENS -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true; detectionMode: mono_and_matrix; matrixCodeType: 3x3; 
              sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;
              videoTexture: true;" vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium; antialias: false;">

        <!-- Camera -->
        <a-entity camera></a-entity>

        <!-- AR Marker - Using Hiro preset with relaxed detection for screens -->
        <a-marker id="marker" preset="hiro" smooth="true" smoothCount="3" smoothTolerance="0.05" smoothThreshold="1">

            <!-- Basket (player) - Made larger and more visible -->
            <a-box id="basket" position="0 0.05 0" scale="0.25 0.12 0.25" color="#FFD700"
                material="shader: flat; side: double; transparent: false" visible="true">
            </a-box>

            <!-- Fruit spawn area (invisible) -->
            <a-entity id="game-anchor"></a-entity>
        </a-marker>
    </a-scene>

    <!-- UI Overlay -->
    <div id="ui-container">
        <!-- Waiting Panel -->
        <div id="waiting-panel" class="panel active">
            <h1>🦶 AR Toe Grip Rehab</h1>
            <p>Point your camera at the marker to begin</p>
            <p style="font-size: 0.8em; color: #888;">Monitor Mode - Tap screen to focus</p>
            <div class="pulse-indicator"></div>
        </div>

        <!-- Calibration Panel -->
        <div id="calibration-panel" class="panel">
            <h2>Calibration</h2>
            <p>Hold your toe in a relaxed, neutral position</p>
            <div class="progress-container">
                <div id="calibration-progress" class="progress-bar"></div>
            </div>
            <p id="calibration-text">0%</p>
        </div>

        <!-- Game HUD -->
        <div id="game-hud" class="panel">
            <div class="hud-top">
                <div class="stat-box">
                    <span class="label">Score</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Time</span>
                    <span id="time" class="value">3:00</span>
                </div>
            </div>

            <div class="hud-middle">
                <div id="combo-text" class="combo"></div>
            </div>

            <div class="hud-bottom">
                <div class="curl-meter">
                    <div class="label">Toe Curl</div>
                    <div class="meter-container">
                        <div id="curl-fill" class="meter-fill"></div>
                    </div>
                    <div id="curl-percent" class="value">0%</div>
                </div>

                <div class="stats-row">
                    <div class="stat-item">
                        <span class="label">Reps:</span>
                        <span id="reps" class="value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">Hold:</span>
                        <span id="hold-time" class="value">0.0s</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Panel -->
        <div id="gameover-panel" class="panel">
            <h2>🎉 Session Complete!</h2>
            <div class="final-stats">
                <div class="stat-item">
                    <span class="label">Final Score:</span>
                    <span id="final-score" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Total Reps:</span>
                    <span id="final-reps" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Max Hold:</span>
                    <span id="final-hold" class="value">0.0s</span>
                </div>
            </div>
            <button id="restart-btn" class="btn">Play Again</button>
        </div>

        <!-- Achievement Popup -->
        <div id="achievement" class="achievement">
            <span id="achievement-text"></span>
        </div>
    </div>

    <!-- Camera Enhancement Script - OPTIMIZED FOR MONITOR SCREENS -->
    <script>
        // Simplified camera settings for monitor detection
        (function () {
            let videoElement = null;
            let videoTrack = null;

            // Override getUserMedia with monitor-friendly settings
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

                navigator.mediaDevices.getUserMedia = function (constraints) {
                    // Use lower resolution for better monitor detection
                    if (constraints && constraints.video) {
                        constraints.video = {
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 640, min: 480 },
                            height: { ideal: 480, min: 360 },
                            aspectRatio: { ideal: 4 / 3 },
                            frameRate: { ideal: 30, min: 15 }
                        };
                    }

                    return originalGetUserMedia(constraints).then(stream => {
                        videoTrack = stream.getVideoTracks()[0];

                        // Apply basic camera settings
                        if (videoTrack && videoTrack.getCapabilities) {
                            const capabilities = videoTrack.getCapabilities();
                            const constraints = {};

                            // Enable continuous autofocus if supported
                            if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                                constraints.focusMode = 'continuous';
                            }

                            // Apply constraints
                            if (Object.keys(constraints).length > 0) {
                                videoTrack.applyConstraints({ advanced: [constraints] }).catch(err => {
                                    console.log('Some camera constraints not supported:', err);
                                });
                            }
                        }

                        return stream;
                    });
                };
            }

            // Add tap-to-focus functionality
            window.addEventListener('DOMContentLoaded', () => {
                setTimeout(() => {
                    videoElement = document.querySelector('video');

                    if (videoElement) {
                        document.addEventListener('click', triggerFocus);
                        document.addEventListener('touchstart', triggerFocus);

                        console.log('✅ Monitor mode active - Tap screen to focus');
                        console.log('💡 Tip: Lower monitor brightness and reduce room lighting for best results');
                    }
                }, 2000);
            });

            function triggerFocus(event) {
                if (!videoTrack) return;

                try {
                    if (videoTrack.getCapabilities && videoTrack.getCapabilities().focusMode) {
                        const capabilities = videoTrack.getCapabilities();

                        if (capabilities.focusMode.includes('manual')) {
                            videoTrack.applyConstraints({
                                advanced: [{ focusMode: 'manual' }]
                            }).then(() => {
                                setTimeout(() => {
                                    videoTrack.applyConstraints({
                                        advanced: [{ focusMode: 'continuous' }]
                                    }).catch(err => console.log('Focus toggle error:', err));
                                }, 100);
                            }).catch(err => console.log('Focus trigger error:', err));
                        }
                    }
                } catch (err) {
                    console.log('Focus control not supported:', err);
                }
            }
        })();
    </script>

    <!-- Game Logic -->
    <script src="game.js"></script>
</body>

</html>
